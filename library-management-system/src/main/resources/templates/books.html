<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Books Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Books Management
    </h1>

    <!-- Search Book -->

    <div class="card p-4 shadow mb-4">

        <h4>Search Book</h4>

        <form action="/books/search/book" method="get">

            <div class="row">

                <div class="col-md-9">

                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Enter Book Name">

                </div>

                <div class="col-md-3">

                    <button class="btn btn-primary w-100">
                        Search
                    </button>

                </div>

            </div>

        </form>

    </div>

    <!-- Add Book -->

    <div class="card p-4 shadow mb-4">

        <h4>Add Book</h4>

        <form>

            <div class="mb-3">

                <label>Book Name</label>

                <input type="text"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label>Category</label>

                <input type="text"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label>Available Copies</label>

                <input type="number"
                       class="form-control">

            </div>

            <button class="btn btn-success">
                Add Book
            </button>

        </form>

    </div>

    <!-- Table -->

    <div class="card shadow p-4">

        <h4 class="mb-3">
            Book List
        </h4>

        <table class="table table-bordered">

            <thead class="table-dark">

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Copies</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody>

            <tr>

                <td>1</td>
                <td>Java</td>
                <td>Programming</td>
                <td>5</td>

                <td>

                    <button class="btn btn-warning btn-sm">
                        Edit
                    </button>

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
