<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<!--
    Navbar Fragment — Thymeleaf Reusable Component

    Ye ek fragment hai jo har page pe use hota hai
    Kaise use kare:
    <div th:replace="~{navbar :: navbar}"></div>

    Links:
    - Dashboard  → /dashboard
    - Books      → /books-page
    - Authors    → /authors-page
    - Users      → /users-page
    - Issue Books→ /issue-page
    - Register   → /register
    - Logout     → /logout
-->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark px-4">

    <!-- Brand Name — Dashboard pe le jaata hai -->
    <a class="navbar-brand" href="/dashboard">📚 Library MS</a>

    <div class="collapse navbar-collapse">

        <!-- Left side links -->
        <ul class="navbar-nav me-auto">

            <li class="nav-item">
                <a class="nav-link" href="/books-page">Books</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/authors-page">Authors</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/users-page">Users</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/issue-page">Issue Books</a>
            </li>

        </ul>

        <!-- Right side — Register + Logout -->
        <ul class="navbar-nav ms-auto">

            <!-- Register — New user register karne ke liye -->
            <li class="nav-item">
                <a class="nav-link" href="/register">Register</a>
            </li>

            <!-- Logout — Session khatam karta hai -->
            <li class="nav-item">
                <a class="nav-link text-danger" href="/logout">Logout</a>
            </li>

        </ul>

    </div>

</nav>

</body>
</html>
