<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Issue Books
    </h1>

    <div class="card shadow p-4 mb-4">

        <form>

            <div class="mb-3">

                <label>User ID</label>

                <input type="number"
                       class="form-control">

            </div>

            <div class="mb-3">

                <label>Book ID</label>

                <input type="number"
                       class="form-control">

            </div>

            <button class="btn btn-primary">
                Issue Book
            </button>

        </form>

    </div>

</div>

</body>
</html>
