<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Authors Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar — har page pe same navbar dikhega, navbar.html fragment se aata hai -->
<div th:replace="~{navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="text-center mb-4">Authors Management</h1>

    <!-- Search — User aur Admin dono kar sakte hain -->
    <div class="card p-4 shadow mb-4 border-primary">
        <h4 class="text-primary">Search</h4>
        <h6>Search Author by Name</h6>
        <form th:action="@{/authors/search}" method="get">
            <div class="row">
                <div class="col-md-9">
                    <input type="text" name="name" class="form-control" placeholder="Enter Author Name">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100">Search</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Admin Panel — Add Author (User click kare to 403 aayega SecurityConfig se) -->
    <div class="card p-4 shadow mb-4 border-danger">
        <h4 class="text-danger">Admin Panel</h4>
        <h6 class="mt-3">Add Author</h6>
        <form th:action="@{/authors/add}" method="post">
            <div class="mb-3">
                <label>Author Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Chetan Bhagat">
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="e.g. author@email.com">
            </div>
            <div class="mb-3">
                <label>Number</label>
                <input type="text" name="number" class="form-control" placeholder="e.g. 9876543210">
            </div>
            <button class="btn btn-danger">Add Author</button>
        </form>
    </div>

    <!-- Author List — Sab dekh sakte hain, Edit/Delete User kare to 403 aayega -->
    <div class="card shadow p-4 mb-4">
        <h4 class="mb-3">Author List</h4>
        <table class="table table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Number</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="author : ${authors}">
                <td th:text="${author.id}"></td>
                <td th:text="${author.name}"></td>
                <td th:text="${author.email}"></td>
                <td th:text="${author.number}"></td>
                <td>
                    <button class="btn btn-warning btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#editModal"
                            th:attr="data-id=${author.id},
                                     data-name=${author.name},
                                     data-email=${author.email},
                                     data-number=${author.number}">
                        Edit
                    </button>
                    <form th:action="@{/authors/delete/{id}(id=${author.id})}" method="post" style="display:inline;">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Author</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm" method="post">
                    <input type="hidden" id="editId" name="id">
                    <div class="mb-3">
                        <label>Author Name</label>
                        <input type="text" id="editName" name="name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="editEmail" name="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Number</label>
                        <input type="text" id="editNumber" name="number" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Update Author</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var editModal = document.getElementById('editModal');
    editModal.addEventListener('show.bs.modal', function(event) {
        var button = event.relatedTarget;
        document.getElementById('editId').value = button.getAttribute('data-id');
        document.getElementById('editName').value = button.getAttribute('data-name');
        document.getElementById('editEmail').value = button.getAttribute('data-email');
        document.getElementById('editNumber').value = button.getAttribute('data-number');
        document.getElementById('editForm').action = '/authors/update/' + button.getAttribute('data-id');
    });
</script>

</body>
</html>
