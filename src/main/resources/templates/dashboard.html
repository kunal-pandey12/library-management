<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar — har page pe same navbar dikhega, navbar.html fragment se aata hai -->
<div th:replace="~{navbar :: navbar}"></div>

<div class="container mt-5">

    <h1 class="text-center mb-5">
        Library Management Dashboard
    </h1>

    <div class="row mb-4">

        <!-- Books Management Button -->
        <!-- Features: Search by name, Search by author, Add book (ADMIN), Delete book (ADMIN), Edit book (ADMIN - pending) -->
        <div class="col-md-3">
            <a href="/books-page" class="btn btn-primary w-100 p-3">
                Manage Books
            </a>
        </div>

        <!-- Authors Management Button -->
        <!-- Features: Author list dekhna (dynamic pending), Add author (ADMIN - pending), Delete author (ADMIN - pending) -->
        <div class="col-md-3">
            <a href="/authors-page" class="btn btn-success w-100 p-3">
                Manage Authors
            </a>
        </div>

        <!-- Users Management Button -->
        <!-- Features: Sirf ADMIN dekh sakta hai, User list (dynamic pending), Delete user (ADMIN - pending) -->
        <div class="col-md-3">
            <a href="/users-page" class="btn btn-dark w-100 p-3">
                Manage Users
            </a>
        </div>

        <!-- Issue Books Button -->
        <!-- Features: Book issue karna (User aur ADMIN), Return book (pending), Fine calculation (pending) -->
        <div class="col-md-3">
            <a href="/issue-page" class="btn btn-warning w-100 p-3">
                Issue Books
            </a>
        </div>

    </div>

    <!-- Logout Button -->
    <!-- Features: Dono USER aur ADMIN logout kar sakte hain, Login page pe redirect hoga -->
    <div class="row mt-4">
        <div class="col-md-3">
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-danger w-100 p-3">
                    Logout
                </button>
            </form>
        </div>
    </div>

</div>

</body>
</html>
