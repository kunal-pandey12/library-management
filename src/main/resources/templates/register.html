<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Library Register</title>

    <!-- Bootstrap CSS — UI styling ke liye -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navbar — har page pe same navbar dikhega, navbar.html fragment se aata hai -->
<div th:replace="~{navbar :: navbar}"></div>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">
                    Register
                </h2>

                <!-- Register Form — /auth/register endpoint pe POST request bhejta hai -->
                <form method="post" action="/auth/register-page">

                    <!-- Name field -->
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter name">
                    </div>

                    <!-- Email field -->
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter email">
                    </div>

                    <!-- Password field -->
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter password">
                    </div>

                    <!-- Role dropdown — User ya Admin select karo -->
                    <div class="mb-3">
                        <label>Role</label>
                        <select name="role" class="form-select">
                            <option value="USER">User</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>

                    <!-- Submit button — form data /auth/register pe bhejta hai -->
                    <button type="submit"
                            class="btn btn-success w-100">
                        Register
                    </button>

                    <!-- Login page ka link — pehle se account hai to login karo -->
                    <div class="mt-3 text-center">
                        <a href="/login">Already have an account? Login</a>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
