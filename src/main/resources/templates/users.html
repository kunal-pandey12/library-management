<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Users Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar — har page pe same navbar dikhega, navbar.html fragment se aata hai -->
<div th:replace="~{navbar :: navbar}"></div>

<div class="container mt-5">


    <h1 class="text-center mb-4">Users Management</h1>

    <div class="card p-4 shadow mb-4 border-danger">
        <h4 class="text-danger">Admin Panel</h4>

        <!-- Search by Name — ADMIN -->
        <h6>Search User by Name</h6>
        <form th:action="@{/users/search}" method="get" class="mb-3">
            <div class="row">
                <div class="col-md-9">
                    <input type="text" name="name" class="form-control" placeholder="Enter User Name">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100">Search</button>
                </div>
            </div>
        </form>
    </div>

    <!-- User List — ADMIN (Edit + Delete) -->
    <div class="card shadow p-4 mb-4">
        <h4 class="mb-3">User List</h4>
        <table class="table table-bordered">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <button class="btn btn-warning btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#editModal"
                            th:attr="data-id=${user.id},
                                     data-name=${user.name},
                                     data-email=${user.email},
                                     data-role=${user.role}">
                        Edit
                    </button>
                    <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<!-- EDIT MODAL -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editForm" method="post">
                    <input type="hidden" id="editId" name="id">
                    <div class="mb-3">
                        <label>Name</label>
                        <input type="text" id="editName" name="name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="editEmail" name="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select id="editRole" name="role" class="form-select">
                            <option value="USER">User</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning w-100">Update User</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var editModal = document.getElementById('editModal');
    editModal.addEventListener('show.bs.modal', function(event) {
        var button = event.relatedTarget;
        document.getElementById('editId').value = button.getAttribute('data-id');
        document.getElementById('editName').value = button.getAttribute('data-name');
        document.getElementById('editEmail').value = button.getAttribute('data-email');
        document.getElementById('editRole').value = button.getAttribute('data-role');
        document.getElementById('editForm').action = '/users/update/' + button.getAttribute('data-id');
    });
</script>

</body>
</html>
